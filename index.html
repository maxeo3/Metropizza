<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doughmetry Master Pro - Ultimate Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans pb-12 text-xs md:text-sm">

  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur py-4 px-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-pizza-slice text-amber-500 text-2xl"></i>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent uppercase tracking-tighter">Doughmetry Master</h1>
          <p class="text-[10px] text-slate-400 uppercase tracking-widest">Advanced Blend & Integral Logic</p>
        </div>
      </div>
      <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full font-mono text-[10px]">v7.5</span>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- COLONNA PARAMETRI -->
    <section class="lg:col-span-7 space-y-6">
      
      <!-- 0. METODO -->
      <div class="bg-slate-800/80 border border-amber-500/30 rounded-2xl p-5 shadow-lg">
        <h2 class="text-amber-400 font-bold mb-3 flex items-center gap-2"><i class="fa-solid fa-diagram-project"></i> METODO D'IMPASTO</h2>
        <div class="grid grid-cols-2 gap-3">
          <button id="btnDirect" class="py-3 rounded-xl border bg-amber-500 text-slate-950 font-bold transition">DIRETTO</button>
          <button id="btnIndirect" class="py-3 rounded-xl border border-slate-700 bg-slate-900 text-slate-400 transition">INDIRETTO</button>
        </div>
        <div id="indirectPanel" class="hidden pt-4 mt-4 border-t border-slate-700 grid grid-cols-2 gap-4">
          <select id="prefermentType" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"><option value="biga">Biga (Idro 50%)</option><option value="poolish">Poolish (Idro 100%)</option></select>
          <input type="number" id="prefermentPct" value="50" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" placeholder="% farina">
        </div>
      </div>

      <!-- 1. RESA -->
      <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5">
        <h2 class="text-slate-200 font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-weight-hanging text-amber-500"></i> RESA & QUANTITÀ</h2>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-[10px] text-slate-400 uppercase">N° Panetti</label><input type="number" id="numBalls" value="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
          <div><label class="text-[10px] text-slate-400 uppercase">Peso (g)</label><input type="number" id="ballWeight" value="250" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
        </div>
      </div>

      <!-- 2. PERCENTUALI -->
      <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 space-y-4">
        <h2 class="text-slate-200 font-bold mb-2 flex items-center gap-2"><i class="fa-solid fa-flask text-amber-500"></i> PERCENTUALI</h2>
        <div>
          <div class="flex justify-between mb-1"><span>Idratazione Base</span><b id="hVal" class="text-amber-400">65%</b></div>
          <input type="range" id="hydration" min="50" max="95" value="65" class="w-full accent-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-[10px] text-slate-400 uppercase">Sale (%)</label><input type="number" id="salt" value="3" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
          <div><label class="text-[10px] text-slate-400 uppercase">Olio (%)</label><input type="number" id="oil" value="0" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
        </div>
      </div>

      <!-- 3. TEMPI -->
      <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 space-y-4">
        <h2 class="text-slate-200 font-bold flex items-center gap-2"><i class="fa-solid fa-clock text-amber-500"></i> FERMENTAZIONE</h2>
        <select id="yeastType" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white mb-2"><option value="fresh">Lievito Fresco (LDB)</option><option value="dry">Lievito Secco (IDY)</option><option value="sourdough">Lievito Madre (LM)</option></select>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-[10px] text-slate-400 uppercase">Ore TA</label><input type="number" id="hoursRoom" value="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
          <div><label class="text-[10px] text-slate-400 uppercase">Temp TA (°C)</label><input type="number" id="tempRoom" value="20" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
          <div><label class="text-[10px] text-slate-400 uppercase">Ore Frigo</label><input type="number" id="hoursFridge" value="16" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
          <div><label class="text-[10px] text-slate-400 uppercase">Temp Frigo (°C)</label><input type="number" id="tempFridge" value="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></div>
        </div>
      </div>

      <!-- 4. BLEND FARINE -->
      <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <h2 class="font-bold text-slate-200 uppercase tracking-tighter"><i class="fa-solid fa-wheat-awn text-amber-500"></i> 4. Miscela Farine (Blend)</h2>
          <button id="openAddFlourModal" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-lg text-[10px]">+ NUOVA FARINA</button>
        </div>
        <div id="blendRowsContainer" class="space-y-3"></div>
        <button id="addBlendRowBtn" class="w-full py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-amber-400">+ AGGIUNGI FARINA AL MIX</button>
        <div id="hydrationAdvice" class="p-3 bg-cyan-900/20 border border-cyan-800 rounded-xl text-cyan-300 text-[11px] italic hidden"></div>
      </div>

    </section>

    <!-- COLONNA RISULTATI -->
    <section class="lg:col-span-5 space-y-6">
      
      <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl p-5 text-slate-950 font-black shadow-xl">
        <div class="flex justify-between">
          <div><span class="text-[10px] uppercase opacity-70">Peso Totale</span><div class="text-4xl" id="totalWeightDisplay">1000 g</div></div>
          <div class="text-right"><span class="text-[10px] uppercase opacity-70">W Mix</span><div class="text-3xl" id="finalWDisplay">W 260</div></div>
        </div>
      </div>

      <div id="alertBox" class="p-4 rounded-2xl border flex items-start gap-3 text-xs transition-all">
        <i id="alertIcon" class="fa-solid text-lg mt-1"></i>
        <div><h4 id="alertTitle" class="font-bold mb-0.5">Controllo...</h4><p id="alertMessage" class="opacity-90"></p></div>
      </div>

      <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 space-y-6">
        <div id="recipeOutputContainer" class="space-y-4"></div>
        <button id="saveRecipeBtn" class="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-lg hover:bg-emerald-500 transition uppercase tracking-widest"><i class="fa-solid fa-bookmark mr-2"></i> Salva in Archivio</button>
      </div>

    </section>

    <!-- STORICO -->
    <section class="lg:col-span-12 bg-slate-800/30 border border-slate-700 rounded-3xl p-6 mt-6">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-200"><i class="fa-solid fa-box-archive text-amber-500"></i> ARCHIVIO RICETTE & NOTE</h2>
      <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

  </main>

  <!-- MODALE FARINA -->
  <div id="flourModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/30 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-amber-400">Nuova Farina</h3>
      <div class="space-y-3">
        <input type="text" id="modalFlourName" placeholder="Nome Farina" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
        <div class="grid grid-cols-2 gap-3">
          <input type="number" id="modalFlourProtein" placeholder="Proteine %" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
          <select id="modalFlourType" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white">
            <option value="0">Raffinata (00/0)</option>
            <option value="1">Semi-Int (T1/2)</option>
            <option value="2">Integrale</option>
          </select>
        </div>
      </div>
      <div class="flex gap-2">
        <button id="closeModalBtn" class="flex-grow py-3 rounded-xl bg-slate-800 text-slate-400 font-bold">Annulla</button>
        <button id="saveModalFlourBtn" class="flex-grow py-3 rounded-xl bg-amber-500 text-slate-950 font-bold">Salva</button>
      </div>
    </div>
  </div>

  <script>
    // --- DATABASE & STATO ---
    let method = 'direct';
    let defaultFlours = [
      { id: 'f1', name: 'Caputo Pizzeria', wNum: 260, protein: '12.5%', type: 0, favorite: true },
      { id: 'f2', name: 'Caputo Cuoco', wNum: 300, protein: '13%', type: 0, favorite: false },
      { id: 'f3', name: 'Integrale Generica', wNum: 240, protein: '13.5%', type: 2, favorite: false }
    ];
    let customFlours = JSON.parse(localStorage.getItem('dm_custom_flours')) || [];
    let activeBlend = JSON.parse(localStorage.getItem('dm_active_blend')) || [{ flourId: 'f1', pct: 100 }];
    let savedRecipes = JSON.parse(localStorage.getItem('dm_recipes')) || [];

    const getW = (p) => p < 10.5 ? 170 : p < 11.5 ? 220 : p < 12.8 ? 260 : p < 13.8 ? 320 : 380;
    const getAllFlours = () => [...defaultFlours, ...customFlours].sort((a,b) => (b.favorite?1:0)-(a.favorite?1:0));

    // --- LOGICA RENDER BLEND ---
    function renderBlend() {
      const all = getAllFlours();
      const container = document.getElementById('blendRowsContainer');
      container.innerHTML = activeBlend.map((row, i) => `
        <div class="flex items-center gap-2 bg-slate-900/50 p-3 rounded-2xl border border-slate-700">
          <select onchange="updateBlendId(${i}, this.value)" class="flex-grow bg-transparent text-white focus:outline-none">
            ${all.map(f => `<option value="${f.id}" ${f.id===row.flourId?'selected':''}>${f.name} (W${f.wNum})</option>`).join('')}
          </select>
          <input type="number" value="${row.pct}" oninput="updateBlendPct(${i}, this.value)" class="w-12 bg-slate-800 border border-slate-700 rounded-lg p-1 text-center">
          <span class="text-slate-500">%</span>
          ${activeBlend.length>1? `<button onclick="removeBlendRow(${i})" class="text-red-400 ml-2"><i class="fa-solid fa-trash-can"></i></button>` : ''}
        </div>
      `).join('');
      calculate();
    }

    window.updateBlendId = (i, id) => { activeBlend[i].flourId = id; saveBlend(); };
    window.updateBlendPct = (i, pct) => { activeBlend[i].pct = parseFloat(pct)||0; saveBlend(); };
    window.removeBlendRow = (i) => { activeBlend.splice(i,1); saveBlend(); };
    function saveBlend() { localStorage.setItem('dm_active_blend', JSON.stringify(activeBlend)); renderBlend(); }
    document.getElementById('addBlendRowBtn').onclick = () => { activeBlend.push({flourId: 'f1', pct: 10}); renderBlend(); };

    // --- CALCOLO PRINCIPALE ---
    function calculateYeast(hR, tR, hF, tF, type) {
      const eq = (hR * Math.pow(tR/20, 2.1)) + (hF * Math.pow(tF/20, 2.1));
      let fPct = eq <= 0 ? 0 : 1.8 / Math.pow(eq, 0.85);
      fPct = Math.max(0.01, Math.min(3.0, fPct));
      if (type==='dry') fPct /= 3; if (type==='sourdough') fPct *= 15;
      return { pct: fPct, eqHours: eq };
    }

    function calculate() {
      const b = +numBalls.value, bw = +ballWeight.value, hB = +hydration.value/100;
      const hR = +hoursRoom.value, tR = +tempRoom.value, hF = +hoursFridge.value, tF = +tempFridge.value;
      const yType = yeastType.value;
      const saltPct = +salt.value/100, oilPct = +oil.value/100;

      hVal.textContent = hydration.value + '%';

      // Blend & Idratazione Integrale
      let wSum = 0, typeSum = 0, pctSum = 0;
      const all = getAllFlours();
      activeBlend.forEach(row => {
        const f = all.find(x => x.id === row.flourId) || all[0];
        wSum += (f.wNum) * (row.pct/100);
        typeSum += (f.type || 0) * (row.pct/100);
        pctSum += row.pct;
      });

      const extraH = typeSum * 0.05; // +5% idro per ogni livello integrale
      const hFinal = hB + extraH;
      const advice = document.getElementById('hydrationAdvice');
      advice.innerHTML = extraH > 0 ? `<i class="fa-solid fa-droplet mr-1"></i> Farine grezze rilevate: idratazione corretta a <b>${Math.round(hFinal*100)}%</b> (+${Math.round(extraH*100)}% per assorbimento).` : "";
      advice.classList.toggle('hidden', extraH <= 0);

      const yInfo = calculateYeast(hR, tR, hF, tF, yType);
      const totalWeight = b * bw;
      const mult = 1 + hFinal + saltPct + oilPct + (yInfo.pct/100);
      const flourTot = totalWeight / mult;
      const waterTot = flourTot * hFinal;

      totalWeightDisplay.textContent = Math.round(totalWeight) + ' g';
      finalWDisplay.textContent = 'W ' + Math.round(wSum);

      // ALERT W-CHECK
      let rMin = yInfo.eqHours > 32 ? 330 : yInfo.eqHours > 16 ? 280 : 200;
      const alertBox = document.getElementById('alertBox');
      if (wSum < rMin - 30) {
        alertBox.className = "p-4 rounded-2xl border flex items-start gap-3 text-xs bg-red-500/10 border-red-500/30 text-red-400";
        alertTitle.textContent = "ATTENZIONE: W DEBOLE";
        alertMessage.textContent = "La farina è troppo debole per questi tempi. L'impasto potrebbe collassare.";
        alertIcon.className = "fa-solid fa-triangle-exclamation";
      } else {
        alertBox.className = "p-4 rounded-2xl border flex items-start gap-3 text-xs bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
        alertTitle.textContent = "W BILANCIATO";
        alertMessage.textContent = "La forza del blend è corretta per la maturazione impostata.";
        alertIcon.className = "fa-solid fa-circle-check";
      }

      // RENDER RICETTA
      let blendHtml = activeBlend.map(row => {
        const f = all.find(x => x.id === row.flourId) || all[0];
        return `<div class="flex justify-between text-[11px] text-slate-400 italic"><span>- ${f.name} (${row.pct}%)</span><span>${Math.round(flourTot * row.pct/100)}g</span></div>`;
      }).join('');

      recipeOutputContainer.innerHTML = `
        <h3 class="text-amber-400 font-bold uppercase text-[10px] tracking-widest mb-3">Ingredienti Calcolati</h3>
        <div class="space-y-3">
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
            <div class="flex justify-between font-bold mb-1"><span><i class="fa-solid fa-wheat-awn text-amber-500 mr-2"></i>FARINA TOTALE</span><span class="text-amber-400">${Math.round(flourTot)}g</span></div>
            ${blendHtml}
          </div>
          <div class="flex justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 font-bold"><span><i class="fa-solid fa-droplet text-cyan-500 mr-2"></i>ACQUA</span><span class="text-cyan-400">${Math.round(waterTot)}g</span></div>
          <div class="flex justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 font-bold"><span><i class="fa-solid fa-mortar-pestle text-slate-400 mr-2"></i>SALE</span><span>${(flourTot*saltPct).toFixed(1)}g</span></div>
          <div class="flex justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 font-bold"><span><i class="fa-solid fa-vial text-emerald-500 mr-2"></i>LIEVITO</span><span class="text-emerald-400">${(flourTot*yInfo.pct/100).toFixed(2)}g</span></div>
          ${oilPct > 0 ? `<div class="flex justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 font-bold"><span><i class="fa-solid fa-oil-can text-yellow-600 mr-2"></i>OLIO</span><span>${(flourTot*oilPct).toFixed(1)}g</span></div>` : ''}
        </div>
      `;
    }

    // --- GESTIONE MODALE FARINA ---
    document.getElementById('openAddFlourModal').onclick = () => document.getElementById('flourModal').classList.remove('hidden');
    document.getElementById('closeModalBtn').onclick = () => document.getElementById('flourModal').classList.add('hidden');
    document.getElementById('saveModalFlourBtn').onclick = () => {
      const name = modalFlourName.value, prot = parseFloat(modalFlourProtein.value), type = parseInt(modalFlourType.value);
      if(!name || isNaN(prot)) return alert("Dati mancanti");
      customFlours.push({ id: 'c'+Date.now(), name, wNum: getW(prot), protein: prot+'%', type, favorite: false });
      localStorage.setItem('dm_custom_flours', JSON.stringify(customFlours));
      document.getElementById('flourModal').classList.add('hidden');
      renderBlend();
    };

    // --- STORICO ---
    saveRecipeBtn.onclick = () => {
      const all = getAllFlours();
      const bDesc = activeBlend.map(x => (all.find(f=>f.id===x.flourId).name)).join(' + ');
      savedRecipes.unshift({ id: Date.now(), date: new Date().toLocaleDateString(), bDesc, weight: numBalls.value*ballWeight.value, rating: 0, comment: '' });
      localStorage.setItem('dm_recipes', JSON.stringify(savedRecipes));
      renderHistory();
    };

    function renderHistory() {
      historyGrid.innerHTML = savedRecipes.map(r => `
        <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl space-y-3">
          <div class="flex justify-between text-[10px]"><b>${r.date}</b><button onclick="deleteRec(${r.id})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>
          <div class="font-bold text-slate-200">${r.weight}g - ${r.bDesc}</div>
          <div class="flex gap-1 text-amber-400">${[1,2,3,4,5].map(s => `<i class="fa-${s<=r.rating?'solid':'regular'} fa-star cursor-pointer" onclick="rate(${r.id},${s})"></i>`).join('')}</div>
          <textarea onchange="comment(${r.id},this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-[10px] text-slate-300 h-12" placeholder="Note...">${r.comment||''}</textarea>
        </div>
      `).join('');
    }

    window.deleteRec = (id) => { savedRecipes = savedRecipes.filter(x=>x.id!==id); localStorage.setItem('dm_recipes', JSON.stringify(savedRecipes)); renderHistory(); };
    window.rate = (id, s) => { savedRecipes.find(x=>x.id===id).rating=s; localStorage.setItem('dm_recipes', JSON.stringify(savedRecipes)); renderHistory(); };
    window.comment = (id, c) => { savedRecipes.find(x=>x.id===id).comment=c; localStorage.setItem('dm_recipes', JSON.stringify(savedRecipes)); };

    // --- INIT ---
    document.querySelectorAll('input, select').forEach(el => el.oninput = calculate);
    btnDirect.onclick = () => { method='direct'; btnDirect.className="py-3 rounded-xl border bg-amber-500 text-slate-950 font-bold transition"; btnIndirect.className="py-3 rounded-xl border border-slate-700 bg-slate-900 text-slate-400 transition"; indirectPanel.classList.add('hidden'); calculate(); };
    btnIndirect.onclick = () => { method='indirect'; btnIndirect.className="py-3 rounded-xl border bg-amber-500 text-slate-950 font-bold transition"; btnDirect.className="py-3 rounded-xl border border-slate-700 bg-slate-900 text-slate-400 transition"; indirectPanel.classList.remove('hidden'); calculate(); };
    
    renderBlend();
    renderHistory();
  </script>
</body>
</html>
